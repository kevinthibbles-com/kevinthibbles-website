name: Update IRCC processing times

on:
  schedule:
    # Every Thursday at 13:17 UTC (about 9:17 a.m. Toronto); IRCC usually updates mid-week.
    - cron: "17 13 * * 4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest processing times from canada.ca
        run: python3 scripts/update_ircc_times.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- tracker/data; then
            echo "Nothing new from IRCC."
            exit 0
          fi
          git config user.name "ktis-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tracker/data
          git commit -m "Update IRCC processing times"
          git push
